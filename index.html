<!DOCTYPE html>
<html lang="en" id="html-tag" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmad Autos | Elite Store</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@400;900&display=swap');

        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; transition: background-color 0.5s, color 0.5s; }
        .font-brand { font-family: 'Orbitron', sans-serif; }

        /* Floating WhatsApp Bubble Animation */
        .whatsapp-bubble {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 999;
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .hero-banner {
            height: 60vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(15,23,42,1)), 
                        url('https://images.pexels.com/photos/11192307/pexels-photo-11192307.jpeg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
        }
        
        /* White Mode Tweaks */
        .light .glass-card {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .red-glow { text-shadow: 0 0 20px rgba(220, 38, 38, 0.8); }

        .owner-frame {
            width: 180px;
            height: 180px;
            border: 6px solid #dc2626;
            padding: 5px;
            background: white;
            box-shadow: 0 15px 35px rgba(220, 38, 38, 0.3);
            border-radius: 50%;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">

    <a href="https://wa.me/923159598830" target="_blank" class="whatsapp-bubble bg-green-500 text-white w-16 h-16 rounded-full flex items-center justify-center text-3xl shadow-2xl">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <nav class="fixed w-full z-[100] bg-white/10 dark:bg-slate-900/20 backdrop-blur-lg border-b border-white/10 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-brand text-red-600 italic red-glow">AHMAD AUTOS</h1>
            
            <button onclick="toggleTheme()" class="flex items-center gap-2 bg-slate-900 dark:bg-white text-white dark:text-slate-900 px-4 py-2 rounded-full font-black text-[10px] uppercase tracking-widest transition-all hover:scale-105">
                <i id="theme-icon" class="fa-solid fa-sun"></i>
                <span id="theme-text">White Mode</span>
            </button>
        </div>
    </nav>

    <header class="hero-banner">
        <div class="text-center" data-aos="zoom-out">
            <h2 class="text-6xl md:text-8xl font-brand italic text-white red-glow mb-4 uppercase">AHMAD<br><span class="text-red-600">AUTOS</span></h2>
            <p class="text-gray-300 font-bold tracking-[0.3em] uppercase text-xs">Serving Charsadda Since 2018</p>
        </div>
    </header>

    <section class="py-16 container mx-auto px-6">
        <div class="max-w-5xl mx-auto glass-card overflow-hidden shadow-2xl" data-aos="fade-up">
            <img src="https://r.jina.ai/i/03a74934a34b46c69f0073539828ed29" alt="Store Details" class="w-full h-auto">
        </div>
    </section>

    <section class="py-20 bg-slate-100 dark:bg-slate-900/40">
        <div class="container mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-16 items-center">
            
            <div class="flex flex-col items-center md:items-start" data-aos="fade-right">
                <div class="owner-frame mb-6">
                    <img src="https://r.jina.ai/i/6c13cc793f024c75837da7a097c6640f" alt="Ahmad Ali" class="w-full h-full object-cover">
                </div>
                <h4 class="text-4xl font-brand italic red-glow uppercase mb-2">Ahmad Ali</h4>
                <p class="text-red-600 font-black tracking-widest uppercase text-[10px] mb-8">Business Owner Since 2018</p>
                
                <div class="space-y-4 font-bold text-sm italic uppercase">
                    <p><i class="fa-solid fa-location-dot text-red-600 mr-2"></i> Gul Abad Pul, Charsadda, KP</p>
                    <p><i class="fa-solid fa-phone text-green-600 mr-2"></i> +92 315 9598830</p>
                </div>
            </div>

            <div class="h-[400px] rounded-[3rem] overflow-hidden shadow-2xl border-4 border-white dark:border-slate-800" data-aos="zoom-in">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d105804.8197177546!2d71.64448558488344!3d34.14882103595537!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x38d92376997491cf%3A0xc391264c92976865!2sCharsadda%2C%20Khyber%20Pakhtunkhwa!5e0!3m2!1sen!2spk!4v1716380000000!5m2!1sen!2spk" class="w-full h-full grayscale dark:invert" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>
    </section>

    <footer class="py-10 text-center opacity-50 text-[10px] font-black uppercase tracking-[0.5em]">
        © 2026 Ahmad Autos | Quality Guaranteed
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000 });

        function toggleTheme() {
            const html = document.getElementById('html-tag');
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                icon.classList.replace('fa-sun', 'fa-moon');
                text.innerText = "Dark Mode";
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                icon.classList.replace('fa-moon', 'fa-sun');
                text.innerText = "White Mode";
            }
        }
    </script>
</body>
</html>
