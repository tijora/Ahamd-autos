<!DOCTYPE html>
<html lang="en" id="html-tag" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmad Autos | 3D Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        /* 3D Glass Effect */
        .glass-3d {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        
        .hero-title {
            transform: translateZ(50px); /* Text floats above container */
            text-shadow: 0 20px 30px rgba(0,0,0,0.5);
        }

        .dark .glass-3d {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Smooth Tilt Transition */
        .tilt-card {
            transition: transform 0.1s ease-out;
            transform-style: preserve-3d;
        }

        body { overflow-x: hidden; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-500">

    <div class="fixed top-5 right-5 z-[100]">
        <button onclick="toggleTheme()" class="bg-white dark:bg-gray-800 p-3 rounded-full shadow-xl border dark:border-gray-700">
            <i id="theme-icon" class="fa-solid fa-moon text-xl text-blue-600"></i>
        </button>
    </div>

    <section id="hero-container" class="relative h-screen flex items-center justify-center bg-black overflow-hidden">
        <div class="absolute inset-0 opacity-60 scale-110">
            <img src="https://images.unsplash.com/photo-1558981403-c5f9899a28bc?auto=format&fit=crop&w=1920&q=80" class="w-full h-full object-cover">
        </div>

        <div id="tilt-box" class="glass-3d p-12 md:p-24 rounded-[50px] text-center text-white max-w-5xl mx-4 tilt-card">
            <h1 class="hero-title text-6xl md:text-9xl font-black italic tracking-tighter uppercase mb-4">
                AHMAD <span class="text-blue-500">AUTOS</span>
            </h1>
            <p class="hero-title text-xl md:text-3xl font-bold tracking-[0.2em] text-blue-300 mb-10">
                GENUINE BIKE PARTS SPECIALIST
            </p>
            <div class="hero-title flex flex-col md:flex-row items-center justify-center gap-6 font-bold">
                <span class="bg-blue-600 px-8 py-3 rounded-full shadow-lg">
                    <i class="fa-solid fa-location-dot mr-2"></i> Gul Abad Pul, Charsadda
                </span>
                <a href="https://wa.me/923159598830" class="bg-green-600 px-8 py-3 rounded-full shadow-lg hover:bg-green-700 transition">
                    <i class="fa-brands fa-whatsapp mr-2"></i> +92 315 9598830
                </a>
            </div>
        </div>
    </section>

    <section class="py-24 container mx-auto px-6">
        <h2 class="text-4xl font-black text-center mb-16 uppercase italic">Our 3D Inventory</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
            <div class="tilt-card bg-white dark:bg-gray-800 p-2 rounded-[30px] shadow-2xl border dark:border-gray-700">
                <img src="https://images.unsplash.com/photo-1486006396193-c8168b832601?auto=format&w=600" class="rounded-[25px] h-60 w-full object-cover mb-6">
                <div class="p-6 text-center">
                    <h3 class="text-2xl font-black uppercase text-blue-600 mb-2">Engine Parts</h3>
                    <p class="text-sm opacity-70 mb-6">Pistons, Valves, and Crankshafts</p>
                    <button class="w-full py-3 border-2 border-blue-600 rounded-xl font-bold hover:bg-blue-600 hover:text-white transition">Details</button>
                </div>
            </div>

            <div class="tilt-card bg-white dark:bg-gray-800 p-2 rounded-[30px] shadow-2xl border dark:border-gray-700">
                <img src="https://images.unsplash.com/photo-1599819811279-d5ad9cccf838?auto=format&w=600" class="rounded-[25px] h-60 w-full object-cover mb-6">
                <div class="p-6 text-center">
                    <h3 class="text-2xl font-black uppercase text-blue-600 mb-2">Chain Kits</h3>
                    <p class="text-sm opacity-70 mb-6">Heavy Duty Chains & Grari Sets</p>
                    <button class="w-full py-3 border-2 border-blue-600 rounded-xl font-bold hover:bg-blue-600 hover:text-white transition">Details</button>
                </div>
            </div>

            <div class="tilt-card bg-white dark:bg-gray-800 p-2 rounded-[30px] shadow-2xl border dark:border-gray-700">
                <img src="https://images.unsplash.com/photo-1547617304-747d76a7493a?auto=format&w=600" class="rounded-[25px] h-60 w-full object-cover mb-6">
                <div class="p-6 text-center">
                    <h3 class="text-2xl font-black uppercase text-blue-600 mb-2">Electrical</h3>
                    <p class="text-sm opacity-70 mb-6">Lights, CDI, and Wiring</p>
                    <button class="w-full py-3 border-2 border-blue-600 rounded-xl font-bold hover:bg-blue-600 hover:text-white transition">Details</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        // 3D TILT LOGIC
        const cards = document.querySelectorAll('.tilt-card');
        
        document.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            
            cards.forEach(card => {
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
        });

        // Reset position when mouse leaves
        document.addEventListener('mouseleave', () => {
            cards.forEach(card => {
                card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            });
        });

        // THEME TOGGLE
        function toggleTheme() {
            const html = document.getElementById('html-tag');
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('light')) {
                html.classList.replace('light', 'dark');
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                html.classList.replace('dark', 'light');
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        }
    </script>
</body>
</html>
